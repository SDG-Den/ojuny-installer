---
modules-search: [ local, @out@/lib/calamares/modules ]

instances:
- id: template
  module: notesqml
  config: template.conf
- id: origin
  module: notesqml
  config: origin.conf
- id: welcome-notes
  module: notesqml
  config: notes-welcome.conf
- id: locale-notes
  module: notesqml
  config: notes-locale.conf
- id: keyboard-notes
  module: notesqml
  config: notes-keyboard.conf
- id: users-notes
  module: notesqml
  config: notes-users.conf
- id: partition-notes
  module: notesqml
  config: notes-partition.conf
- id: summary-notes
  module: notesqml
  config: notes-summary.conf
- id: finished-notes
  module: notesqml
  config: notes-finished.conf
- module: ojuny
  weight: 48

sequence:
- show:
  - welcome
  - notesqml@welcome-notes
  - notesqml@template
  - notesqml@locale-notes
  - locale
  - notesqml@keyboard-notes
  - keyboard
  - notesqml@users-notes
  - users
  - notesqml@origin
  - notesqml@partition-notes
  - partition
  - notesqml@summary-notes
  - summary
- exec:
  - partition
  - mount
  - ojuny
  - umount
- show:
  - notesqml@finished-notes
  - finished

branding: ojuny
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: false
quit-at-end: false
